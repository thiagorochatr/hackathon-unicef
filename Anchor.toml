[features]
resolution = true
skip-lint = false

[programs.localnet]
custodia = "FsvcQn5BsZuC1CrqMtxNGFhohWFVxJq4jDnzwKgw493E"

[programs.devnet]
custodia = "FsvcQn5BsZuC1CrqMtxNGFhohWFVxJq4jDnzwKgw493E"

[registry]
url = "https://api.apr.dev"

[provider]
# devnet: o validador local 4.1.1 não habilita a versão de SBPF que as
# platform-tools disponíveis emitem; a devnet habilita. Testar contra ela tem
# o efeito colateral desejável de gerar transações verificáveis no explorer.
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
